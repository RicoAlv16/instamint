<section>
  <header class="bg-white space-y-4 p-4 sm:px-8 sm:py-1 lg:p-4 xl:px-8 xl:py-6">
    <div class="flex items-center justify-between">
      <h2 class="font-semibold text-slate-900">Search minter | tea bag</h2>
    </div>

    <input
      class="form-control search"
      type="text"
      aria-label="Filter NFTs"
      placeholder="&#61442; Filter NFTs..."
      (input)="filterMinterTeaBag()"
      [(ngModel)]="searchWord" />

    <ul class="flex space-x-3 nav nav-pills nav-justified">
      <li>
        <a class="block px-3 py-2">
          <i> Search by </i>
        </a>
      </li>

      <li class="nav-item">
        <a
          href="javascript:void(0)"
          class="block px-3 py-2 rounded-md nav-link texte-white"
          aria-expanded="true"
          [ngClass]="{ active: key === 'username' }"
          (click)="changeTab('username')">
          username
        </a>
      </li>

      <li class="nav-item">
        <a
          href="javascript:void(0)"
          class="block px-3 py-2 rounded-md nav-link texte-white"
          aria-expanded="true"
          [ngClass]="{ active: key === 'location' }"
          (click)="changeTab('location')">
          location
        </a>
      </li>
    </ul>
  </header>
  <div class="bg-white">
    <div
      class="mx-auto max-w-2xl px-4 py-16 sm:px-6 sm:py-1 lg:max-w-7xl lg:px-8">
      <div
        class="mt-6 grid grid-cols-1 gap-x-6 gap-y-10 sm:grid-cols-2 lg:grid-cols-4 xl:gap-x-8">
        <div
          class="group relative"
          *ngFor="let item of minterTeaBagTableFilted">
          <a routerLink="/account/social-features/{{ item.username }}">
            <div
              class="aspect-h-1 aspect-w-1 w-full overflow-hidden rounded-md bg-gray-200 lg:aspect-none group-hover:opacity-75 lg:h-30">
              <img
                src="../../../assets/images/NFTs/user.png"
                alt="Front of men&#039;s Basic Tee in black."
                class="h-16 w-16 rounded-full object-cover object-center" />
            </div>
            <div class="mt-4 flex justify-between">
              <div>
                <h1 class="text-sm">
                  <span aria-hidden="true" class="absolute inset-0"></span>
                  {{ item.username }}
                </h1>
                <div class="min-w-0 relative flex-auto">
                  <dl
                    class="mt-2 flex text-sm leading-6 font-medium text-gray-700">
                    <div class="ml-2">
                      <dt class="text-green-500">
                        <span class="sr-only">number followers</span>

                        <svg
                          xmlns="http://www.w3.org/2000/svg"
                          width="2em"
                          height="2em"
                          viewBox="0 0 24 24">
                          <path
                            fill="currentColor"
                            d="M13 11a3 3 0 1 0-3-3a3 3 0 0 0 3 3m0-4a1 1 0 1 1-1 1a1 1 0 0 1 1-1m4.11 3.86a5 5 0 0 0 0-5.72A2.91 2.91 0 0 1 18 5a3 3 0 0 1 0 6a2.91 2.91 0 0 1-.89-.14M13 13c-6 0-6 4-6 4v2h12v-2s0-4-6-4m-4 4c0-.29.32-2 4-2c3.5 0 3.94 1.56 4 2m7 0v2h-3v-2a5.6 5.6 0 0 0-1.8-3.94C24 13.55 24 17 24 17M8 12H5v3H3v-3H0v-2h3V7h2v3h3Z" />
                        </svg>
                      </dt>
                    </div>
                    <div>
                      <dt class="sr-only">followers</dt>
                      <dd>{{ item.followers }}</dd>
                    </div>
                    <div class="ml-3">
                      <dt class="sr-only">Year</dt>
                      <dd>tea bag:{{ item.idTeaBag }}</dd>
                    </div>
                    <div class="ml-3">
                      <dt class="sr-only">Size</dt>
                      <dd class="px-1.5 ring-1 ring-slate-200 rounded">
                        {{ item.location }}
                      </dd>
                    </div>
                  </dl>
                </div>
                <ng-container *ngIf="item.phone">
                  <p class="mt-1 text-sm text-slate-400 text-gray-300">
                    Minter
                  </p>
                </ng-container>
                <ng-container *ngIf="!item.phone">
                  <p class="mt-1 text-sm text-slate-400 text-gray-300">
                    Tea bag
                  </p>
                </ng-container>
              </div>
              <p class="text-sm font-medium text-gray-900">
                {{ item.phone }}
              </p>
            </div>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
