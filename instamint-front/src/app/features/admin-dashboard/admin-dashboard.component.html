<div class="container">
  <h1>Tableau de Bord Administrateur</h1>

  <div class="section">
    <h2>Minters</h2>
    <div>
      <label for="minterId">Minter ID</label>
      <input id="minterId" type="number" (input)="onMinterIdInput($event)" />
    </div>
    <button (click)="disableMinter()">Désactiver Minter</button>
    <button (click)="deleteMinter()">Supprimer Minter</button>
  </div>

  <div class="section">
    <h2>Tea Bags</h2>
    <div>
      <label for="teaBagId">Tea Bag ID</label>
      <input id="teaBagId" type="number" (input)="onTeaBagIdInput($event)" />
    </div>
    <button (click)="deleteTeaBag()">Supprimer Tea Bag</button>
  </div>
</div>
