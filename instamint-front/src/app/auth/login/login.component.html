<div class="formContainer">
  <div class="titleContainer">
    <h2>Connexion</h2>
  </div>
  <form
    name="form"
    class="login"
    #f="ngForm"
    (ngSubmit)="f.form.valid && onSubmit()">
    <div class="group">
      <label for="email">Email</label>
      <input
        type="text"
        name="email"
        id="email"
        [(ngModel)]="form.email"
        #email="ngModel"
        required />
      <div class="formError" *ngIf="email.errors && f.submitted">
        Email is required !
      </div>
    </div>
    <div class="group">
      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        [(ngModel)]="form.password"
        #password="ngModel"
        required
        minlength="5" />
      <div class="formError" *ngIf="password.errors && f.submitted">
        Password is required !
      </div>
    </div>
    <div class="group">
      <button>Login</button>
    </div>
    <div class="group">
      <p>Don’t have an account? <a href="#">SIGN UP NOW</a></p>
    </div>
  </form>
</div>
